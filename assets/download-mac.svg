<svg xmlns="http://www.w3.org/2000/svg" width="440" height="92" viewBox="0 0 440 92">
  <defs>
    <linearGradient id="macBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1F54"/>
      <stop offset="50%" stop-color="#281136"/>
      <stop offset="100%" stop-color="#14071D"/>
    </linearGradient>
    <linearGradient id="macBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC97"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
    <linearGradient id="macIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <filter id="macGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3DDC97" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Button Shell -->
  <rect x="3" y="3" width="434" height="86" rx="16" ry="16" fill="url(#macBg)" stroke="url(#macBorder)" stroke-width="3" filter="url(#macGlow)"/>

  <!-- Left Icon Tile -->
  <rect x="18" y="16" width="60" height="60" rx="14" ry="14" fill="url(#macIconBg)" stroke="#48484A" stroke-width="1.5"/>

  <!-- Official Apple Logo (White with subtle shine) -->
  <g fill="#FFFFFF" transform="translate(19, 17) scale(0.95)">
    <!-- Leaf -->
    <path d="M 37.5 12.5 C 39.5 9.8 40.8 6.2 40.2 2.5 C 37.1 2.8 33.5 4.8 31.8 7.5 C 30.2 9.4 28.8 13.1 29.5 16.5 C 32.8 16.8 35.8 14.8 37.5 12.5 Z"/>
    <!-- Apple Body with Bite -->
    <path d="M 40.2 19.5 C 35.5 19.2 31.5 22 29.2 22 C 26.8 22 23.5 19.5 19.8 19.5 C 14.8 19.5 10.2 22.5 7.5 27.2 C 2.2 36.5 6.2 50.2 11.2 57.5 C 13.8 61 16.5 65 20.2 64.8 C 23.8 64.5 25.2 62.5 29.5 62.5 C 33.8 62.5 35 64.8 38.8 64.8 C 42.5 64.8 45 61 47.5 57.5 C 50.5 53.2 51.8 49 52 48.5 C 51.5 48.2 45.5 45.8 45.2 39.2 C 45 33.8 49.5 31 49.8 30.8 C 47.2 27 43.2 26.5 41.8 26.2 C 39.8 25.8 40.8 19.5 40.2 19.5 Z"/>
  </g>

  <!-- Button Text -->
  <text x="94" y="42" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0.8">DOWNLOAD FOR MACOS</text>
  <text x="94" y="65" fill="#3DDC97" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.3">re-B.U.N.S-macOS.zip  ·  Apple Silicon &amp; Intel</text>
</svg>
