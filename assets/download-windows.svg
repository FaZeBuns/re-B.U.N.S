<svg xmlns="http://www.w3.org/2000/svg" width="440" height="92" viewBox="0 0 440 92">
  <defs>
    <linearGradient id="winBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1F54"/>
      <stop offset="50%" stop-color="#281136"/>
      <stop offset="100%" stop-color="#14071D"/>
    </linearGradient>
    <linearGradient id="winBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
    <linearGradient id="winIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2ED"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <filter id="winGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Button Shell -->
  <rect x="3" y="3" width="434" height="86" rx="16" ry="16" fill="url(#winBg)" stroke="url(#winBorder)" stroke-width="3" filter="url(#winGlow)"/>

  <!-- Left Icon Tile -->
  <rect x="18" y="16" width="60" height="60" rx="14" ry="14" fill="url(#winIconBg)"/>

  <!-- Official Windows 4-Tile Logo in Crisp White -->
  <g fill="#FFFFFF" transform="translate(29, 27) scale(1.1)">
    <path d="M0 4.67 L12.67 2.92 V14.67 H0 Z"/>
    <path d="M14.67 2.65 L32 0 V14.67 H14.67 Z"/>
    <path d="M0 16.67 H12.67 V28.42 L0 26.67 Z"/>
    <path d="M14.67 16.67 H32 V31.33 L14.67 28.68 Z"/>
  </g>

  <!-- Button Text -->
  <text x="94" y="42" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0.8">DOWNLOAD FOR WINDOWS</text>
  <text x="94" y="65" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.3">re-BUNS.exe  ·  Windows 10 / 11 (Standalone)</text>
</svg>
